<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OOZY 매출관리</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginView" class="center-view">
    <section class="login-card">
      <div class="brand">OOZY</div>
      <h1>매출·매입 관리</h1>
      <p class="muted">관리자/확인자 계정으로 로그인해 일·월·연 매출을 확인합니다.</p>
      <label>로그인 ID / 이메일</label>
      <input id="loginEmail" type="text" autocomplete="username" placeholder="로그인 ID 또는 이메일" />
      <label>비밀번호</label>
      <input id="loginPassword" type="password" autocomplete="current-password" />
      <button id="loginButton" class="primary">로그인</button>
      <div id="loginMessage" class="message"></div>
    </section>
  </div>

  <div id="appView" class="app hidden">
    <header class="header">
      <div class="header-brand"><strong>OOZY</strong><span>매출·매입 관리</span></div>
      <nav>
        <button data-page="daily" class="nav active">일매출</button>
        <button data-page="month" class="nav">월매출</button>
        <button data-page="year" class="nav">연매출</button>
      </nav>
      <div class="account"><span id="accountLabel"></span><button id="logoutButton">로그아웃</button></div>
    </header>

    <main>
      <section id="dailyPage" class="page">
        <div class="page-head">
          <div><h2>일매출 확인</h2><p id="syncText" class="muted"></p></div>
          <div class="date-nav"><button id="prevDay">◀ 전일</button><input id="dailyDate" type="date" /><button id="nextDay">후일 ▶</button></div>
        </div>
        <div id="dailyKpis" class="kpi-grid six"></div>
        <div class="two-col">
          <section class="panel"><h3>매출 구성</h3><div id="dailySalesTable"></div></section>
          <section class="panel"><h3>매입</h3><div id="dailyPurchaseTable"></div></section>
        </div>
      </section>

      <section id="monthPage" class="page hidden">
        <div class="page-head">
          <div><h2>월매출</h2><p class="muted">날짜를 클릭하면 해당 일매출로 이동합니다.</p></div>
          <div class="date-nav"><button id="prevMonth">◀</button><input id="monthPicker" type="month" /><button id="nextMonth">▶</button></div>
        </div>
        <div id="monthKpis" class="kpi-grid four"></div>
        <section class="panel"><div id="monthCalendar" class="calendar"></div></section>
        <section class="panel"><h3>배달 채널 월 합계</h3><div id="monthDelivery"></div></section>
      </section>

      <section id="yearPage" class="page hidden">
        <div class="page-head">
          <div><h2>연매출</h2><p class="muted">월을 클릭하면 월매출로 이동합니다.</p></div>
          <div class="date-nav"><button id="prevYear">◀</button><input id="yearInput" type="number" min="2000" max="2100" /><button id="nextYear">▶</button></div>
        </div>
        <div id="yearKpis" class="kpi-grid four"></div>
        <div id="yearCards" class="year-grid"></div>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="login_aliases.js"></script>
  <script src="app.js"></script>
</body>
</html>
